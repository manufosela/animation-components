<!DOCTYPE html>
<html lang="en">
<head>
  <script type="importmap">
    {
      "imports": {
        "lit": "https://esm.sh/lit@3",
        "lit/": "https://esm.sh/lit@3/"
      }
    }
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>scene-protonimg - Demo</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background: #131313;
      color: #f4f5f2;
      font-family: "Inter", system-ui, sans-serif;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header { margin-bottom: 3rem; }
    h1 {
      font-family: "Manrope", system-ui, sans-serif;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .subtitle { color: #b9cbc2; margin: 0.5rem 0 0.75rem; }
    .back-link { font-size: 0.85rem; color: #b9cbc2; text-decoration: none; }
    .back-link:hover { color: #00e0b3; }
    .demo-card {
      background: #1c1b1b;
      border-radius: 1rem;
      padding: 2rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: center;
    }
    .hint {
      color: #b9cbc2;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <p><a class="back-link" href="../../../">&larr; Back to components</a></p>
      <h1>scene-protonimg</h1>
      <p class="subtitle">Particle animation that morphs between two images using the Proton engine.</p>
    </header>

    <div class="demo-card">
      <scene-protonimg
        width="900"
        height="300"
        time="5"
        background="#000"
        imagen1="img/scene-protonimg-demo1.png"
        imagen2="img/scene-protonimg-demo2.png"
      ></scene-protonimg>
    </div>
    <p class="hint">Particles morph between both images every 5 seconds.</p>
  </div>

  <script type="module" src="../src/scene-protonimg.js"></script>
</body>
</html>
